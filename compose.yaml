services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: bibmgr
      POSTGRES_USER: bibmgr
      POSTGRES_PASSWORD: bibmgr
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bibmgr -d bibmgr"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - bibmgr-postgres-data:/var/lib/postgresql

  mailpit:
    image: axllent/mailpit:v1.30.0
    environment:
      MP_MAX_MESSAGES: "500"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  bibmgr-postgres-data:
