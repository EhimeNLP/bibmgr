name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Repository format checks
        run: |
          uv run --frozen --no-default-groups poe check-lock
          uv run --frozen --no-default-groups poe check-markdown
          uv run --frozen --no-default-groups poe check-schema
      - name: Architecture, formatting, Clippy, and documentation checks
        run: uv run --frozen --no-default-groups poe check-rust
      - name: Unit and integration tests
        run: uv run --frozen --no-default-groups poe test-rust

  rust-msrv:
    name: Rust 1.86 minimum-version check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features --locked

  cli-installer:
    name: CLI installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/test_installer.sh

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv run --frozen --no-default-groups poe setup-frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: uv run --frozen --no-default-groups poe check-frontend
      - run: uv run --frozen --no-default-groups poe test-frontend
      - run: uv run --frozen --no-default-groups poe build-frontend
      - name: Build frontend for a proxy subpath
        run: BIBMGR_BASE_PATH=/bibmgr uv run --frozen --no-default-groups poe build-frontend

  deployment:
    name: Production deployment configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate direct-HTTPS Compose mode
        run: >-
          docker compose --env-file .env.production.example
          -f compose.production.yaml
          -f compose.production.direct.yaml
          config
      - name: Validate external-proxy Compose mode
        run: >-
          docker compose --env-file .env.production.example
          -f compose.production.yaml
          -f compose.production.proxy.yaml
          config
      - name: Validate direct-HTTPS Caddy configuration
        run: >-
          docker run --rm
          -e BIBMGR_SITE_ADDRESS=bibmgr.example.com
          -e BIBMGR_MAX_REQUEST_BODY_BYTES=1048576
          -v "$PWD/deploy/caddy:/etc/caddy/bibmgr:ro"
          caddy:2.10-alpine
          caddy validate
          --config /etc/caddy/bibmgr/direct.Caddyfile
          --adapter caddyfile
      - name: Validate external-proxy Caddy configuration
        run: >-
          docker run --rm
          -e BIBMGR_BASE_PATH=/bibmgr
          -e BIBMGR_MAX_REQUEST_BODY_BYTES=1048576
          -e BIBMGR_TRUSTED_PROXY_CIDRS=192.0.2.10/32
          -v "$PWD/deploy/caddy:/etc/caddy/bibmgr:ro"
          caddy:2.10-alpine
          caddy validate
          --config /etc/caddy/bibmgr/proxy.Caddyfile
          --adapter caddyfile
      - name: Exercise external-proxy security boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/caddy_test_backend.py --port 8000 &
          sink_pid=$!
          cleanup() {
            docker rm --force bibmgr-caddy-security-check >/dev/null 2>&1 || true
            kill "$sink_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --rm --detach \
            --name bibmgr-caddy-security-check \
            --add-host backend:host-gateway \
            --publish 127.0.0.1:18080:80 \
            -e BIBMGR_BASE_PATH=/bibmgr \
            -e BIBMGR_MAX_REQUEST_BODY_BYTES=1024 \
            -e BIBMGR_TRUSTED_PROXY_CIDRS=192.0.2.10/32 \
            -v "$PWD/deploy/caddy:/etc/caddy/bibmgr:ro" \
            caddy:2.10-alpine \
            caddy run \
            --config /etc/caddy/bibmgr/proxy.Caddyfile \
            --adapter caddyfile
          for _attempt in {1..20}; do
            if curl --silent --fail \
              http://127.0.0.1:18080/bibmgr >/dev/null; then
              break
            fi
            sleep 0.1
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:18080/bibmgr/api/metrics)" = "404"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:18080/bibmgr/api/metrics/)" = "404"
          test "$(head -c 1024 /dev/zero | curl --silent \
            --output /dev/null --write-out '%{http_code}' \
            --request POST --data-binary @- \
            http://127.0.0.1:18080/bibmgr/api/auth/email/start)" = "204"
          head -c 1025 /dev/zero | curl --silent \
            --dump-header /tmp/bibmgr-caddy-headers \
            --output /dev/null \
            --request POST --data-binary @- \
            http://127.0.0.1:18080/bibmgr/api/auth/email/start
          grep --quiet "HTTP/1.1 413" /tmp/bibmgr-caddy-headers
          grep --ignore-case --quiet \
            "^Content-Security-Policy:" /tmp/bibmgr-caddy-headers
          if grep --ignore-case --quiet "^Server:" \
            /tmp/bibmgr-caddy-headers; then
            exit 1
          fi

  python-parity:
    name: Python ${{ matrix.python-version }} binding and backend parity
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: bibmgr_test
          POSTGRES_USER: bibmgr
          POSTGRES_PASSWORD: bibmgr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bibmgr -d bibmgr_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      BIBMGR_TEST_POSTGRES_URL: postgresql+psycopg://bibmgr:bibmgr@127.0.0.1:5432/bibmgr_test
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Build native wheel
        run: uv run --frozen poe build-native
      - name: Python binding/backend tests
        run: uv run --frozen poe test-backend
      - name: Build backend wheel
        run: uv run --frozen poe build-backend
      - name: CLI, PyO3, and backend DTO parity
        run: uv run --frozen poe test-parity

  metadata-extraction:
    name: Metadata extraction tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
          python-version: "3.12"
      - run: >-
          uv run --project pipeline/metadata_extraction --frozen --group dev
          pytest -q pipeline/metadata_extraction/tests

  browser-e2e:
    name: Browser E2E and accessibility
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: bibmgr_e2e
          POSTGRES_USER: bibmgr
          POSTGRES_PASSWORD: bibmgr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bibmgr -d bibmgr_e2e"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      mailpit:
        image: axllent/mailpit:v1.30.0
        ports:
          - 1025:1025
          - 8025:8025
    env:
      BIBMGR_DATABASE_URL: postgresql+psycopg://bibmgr:bibmgr@127.0.0.1:5432/bibmgr_e2e
      BIBMGR_AUTH_SECRET: e2e-only-authentication-secret
      BIBMGR_AUTH_ALLOWED_EMAILS: e2e.visitor@example.org
      BIBMGR_SMTP_HOST: 127.0.0.1
      BIBMGR_SMTP_PORT: "1025"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv run --frozen poe setup
      - run: .venv/bin/bibmgr-db upgrade
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend

  fuzz-build:
    name: Fuzz target build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz build

  security:
    name: Dependency, source, and license policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve the audited dependency graph
        run: cargo generate-lockfile
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
          command-arguments: licenses bans sources

  benchmark-record:
    name: Benchmark record
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benches -> target
      - name: Build benchmark harness
        run: cargo bench --manifest-path benches/Cargo.toml --no-run
      - name: Record Criterion measurements
        run: cargo bench --manifest-path benches/Cargo.toml -- --noplot
      - name: Upload benchmark record
        uses: actions/upload-artifact@v4
        with:
          name: criterion-${{ github.sha }}
          path: benches/target/criterion
          if-no-files-found: error
          retention-days: 30
