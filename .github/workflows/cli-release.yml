name: CLI release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match the tag to the CLI package version
        shell: bash
        run: |
          cli_version=$(
            cargo metadata --no-deps --format-version 1 |
              jq -r '.packages[] | select(.name == "bibmgr-cli") | .version'
          )
          if [[ "$GITHUB_REF_NAME" != "v$cli_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match bibmgr-cli version $cli_version."
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            builder: cross
            archive: tar
            smoke_test: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            builder: cross
            archive: tar
            smoke_test: false
          - os: macos-14
            target: x86_64-apple-darwin
            builder: cargo
            archive: tar
            smoke_test: false
          - os: macos-14
            target: aarch64-apple-darwin
            builder: cargo
            archive: tar
            smoke_test: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            builder: cargo
            archive: zip
            smoke_test: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install cross
        if: matrix.builder == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build with Cargo
        if: matrix.builder == 'cargo'
        run: >-
          cargo build --locked --release
          --package bibmgr-cli
          --target ${{ matrix.target }}
      - name: Build with cross
        if: matrix.builder == 'cross'
        run: >-
          cross build --locked --release
          --package bibmgr-cli
          --target ${{ matrix.target }}
      - name: Smoke-test Unix executable
        if: matrix.smoke_test && runner.os != 'Windows'
        run: ./target/${{ matrix.target }}/release/bibmgr --version
      - name: Smoke-test Windows executable
        if: matrix.smoke_test && runner.os == 'Windows'
        run: .\target\${{ matrix.target }}\release\bibmgr.exe --version
      - name: Package Unix executable
        id: package-unix
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          asset="bibmgr-${{ matrix.target }}.tar.gz"
          stage="dist/${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/bibmgr" "$stage/bibmgr"
          cp LICENSE-APACHE LICENSE-MIT "$stage/"
          tar -czf "$asset" -C "$stage" bibmgr LICENSE-APACHE LICENSE-MIT
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" >"$asset.sha256"
          else
            shasum -a 256 "$asset" >"$asset.sha256"
          fi
          echo "asset=$asset" >>"$GITHUB_OUTPUT"
      - name: Package Windows executable
        id: package-windows
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $asset = "bibmgr-${{ matrix.target }}.zip"
          $stage = "dist/${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/bibmgr.exe" "$stage/bibmgr.exe"
          Copy-Item -Path "LICENSE-APACHE", "LICENSE-MIT" -Destination $stage
          Compress-Archive -Path "$stage/*" -DestinationPath $asset
          $checksum = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLowerInvariant()
          "$checksum  $asset" | Out-File -Encoding ascii "$asset.sha256"
          "asset=$asset" >> $env:GITHUB_OUTPUT
      - name: Select packaged asset
        id: package
        shell: bash
        env:
          UNIX_ASSET: ${{ steps.package-unix.outputs.asset }}
          WINDOWS_ASSET: ${{ steps.package-windows.outputs.asset }}
        run: |
          if [[ -n "$UNIX_ASSET" ]]; then
            echo "asset=$UNIX_ASSET" >>"$GITHUB_OUTPUT"
          else
            echo "asset=$WINDOWS_ASSET" >>"$GITHUB_OUTPUT"
          fi
      - name: Attest release archive
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.package.outputs.asset }}
      - name: Stage release assets
        uses: actions/upload-artifact@v4
        with:
          name: bibmgr-cli-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bibmgr-cli-*
          path: release-assets
          merge-multiple: true
      - name: Add the installer
        run: cp scripts/install.sh release-assets/bibmgr-installer.sh
      - name: Attest installer
        uses: actions/attest@v4
        with:
          subject-path: release-assets/bibmgr-installer.sh
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
