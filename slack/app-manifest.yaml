_metadata:
  major_version: 1

# Slack's regular YAML manifest cannot embed an icon asset. After creating the
# app, upload slack/assets/icon.png or a custom compatible image.
display_information:
  name: BibMgR
  description: Validate, fix, and export one BibTeX entry from a Slack message.
  background_color: "#1682F2"

features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: BibMgR
    always_online: false

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - im:history

settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
  is_hosted: false
