[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "bibmgr-native"
version = "0.1.0"
description = "Python bindings for the bibmgr Rust core"
requires-python = ">=3.8"
license = "MIT"
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "bibmgr_native"
