[package]
name = "bibmgr-wasm"
description = "General-purpose WebAssembly API for BibTeX analysis, registration validation, safe fixes, and export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bibmgr-core.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2.129"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# bibtex-parser's randomized hash tables use getrandom through ahash.
getrandom = { version = "0.3.4", features = ["wasm_js"] }

[lints]
workspace = true

[package.metadata.wasm-pack.profile.release]
# Keep builds reproducible without downloading a separate wasm-opt binary.
wasm-opt = false
