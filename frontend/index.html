<!doctype html>
<html lang="en" data-theme="light" data-theme-preference="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#f5f5f7" />
    <script>
      (() => {
        const storageKey = "bibmgr-theme";
        const storedTheme = (() => {
          try {
            return localStorage.getItem(storageKey);
          } catch {
            return null;
          }
        })();
        const preference = ["light", "dark", "system"].includes(storedTheme)
          ? storedTheme
          : "system";
        const resolvedTheme =
          preference === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : preference;

        document.documentElement.dataset.theme = resolvedTheme;
        document.documentElement.dataset.themePreference = preference;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute(
            "content",
            resolvedTheme === "dark" ? "#0b0b0c" : "#f5f5f7",
          );
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BibMgr helps research teams find, review, and reuse bibliography records."
    />
    <title>BibMgr · Laboratory Bibliography Manager</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
