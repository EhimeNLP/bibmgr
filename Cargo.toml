[workspace]
resolver = "3"
members = [
  "crates/bibmgr-model",
  "crates/bibmgr-syntax",
  "crates/bibmgr-semantics",
  "crates/bibmgr-validation",
  "crates/bibmgr-edit",
  "crates/bibmgr-export",
  "crates/bibmgr-core",
  "crates/bibmgr-search",
  "crates/bibmgr-cli",
  "crates/bibmgr-python",
  "crates/bibmgr-wasm",
]

[workspace.package]
version = "0.1.7"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/EhimeNLP/bibmgr"
publish = false

[workspace.dependencies]
bibmgr-model = { path = "crates/bibmgr-model" }
bibmgr-syntax = { path = "crates/bibmgr-syntax" }
bibmgr-semantics = { path = "crates/bibmgr-semantics" }
bibmgr-validation = { path = "crates/bibmgr-validation" }
bibmgr-edit = { path = "crates/bibmgr-edit" }
bibmgr-export = { path = "crates/bibmgr-export" }
bibmgr-core = { path = "crates/bibmgr-core" }
bibmgr-search = { path = "crates/bibmgr-search" }
bibtex-parser = "0.4.0"
clap = { version = "4.6.7", features = ["derive"] }
pyo3 = { version = "0.29.3", features = ["abi3-py38"] }
rayon = "1.12"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
toml = "1.1.8"
url = { version = "2.5.8", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
