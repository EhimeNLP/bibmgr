[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bibtex-reconstruction"
version = "0.1.0"
description = "Evidence-grounded, high-accuracy BibTeX reconstruction pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bibmgr-native",
    "bibtexparser>=2.0.0b9",
    "google-genai>=1.75.0",
    "lxml>=6.1.0",
    "pydantic>=2.13.2",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
]

[project.scripts]
bibtex-reconstruction = "bibtex_reconstruction.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.uv.sources]
bibmgr-native = { path = "../../crates/bibmgr-python", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/bibtex_reconstruction"]
