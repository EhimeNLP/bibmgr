search:
  similarity_threshold: 0.95
  trusted_doi_threshold: 0.97
  max_parallel_requests: 5

llm:
  model_name: "gemini-2.5-pro"
  max_output_tokens: 2048
  temperature: 0.1
  max_llm_attempts: 3

validation:
  registration_policy: "laboratory"
  rewrite_citation_keys: true

api:
  max_retries: 2
  retry_backoff_sec: 2
  doi_base_url: "https://doi.org/"
  doi_timeout: 15
  crossref:
    base_url: "https://api.crossref.org/works"
    timeout: 10
  cinii:
    base_url: "https://cir.nii.ac.jp/opensearch/v2"
    timeout: 10
    wait_sec: 0.5
  semanticscholar:
    base_url: "https://api.semanticscholar.org/graph/v1/paper/search"
    timeout: 10
    wait_sec: 1
  jstage:
    base_url: "https://api.jstage.jst.go.jp/searchapi/do"
    timeout: 10
  arxiv:
    base_url: "https://export.arxiv.org/api/query"
    timeout: 10
    wait_sec: 1
