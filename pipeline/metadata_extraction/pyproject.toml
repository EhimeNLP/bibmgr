[project]
name = "bibmgr-paper-extractor"
version = "0.1.0"
description = "Metadata and reference-list extraction for PDF papers."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
paddleocr-vl = ["paddleocr>=3.0.0"]

[project.scripts]
bibmgr-paper-extract = "paper_extractor.cli:main"
bibmgr-paper-parse = "paper_extractor.parse_output:main"

[dependency-groups]
dev = ["pytest>=8.0.0"]
gpu = [
    "paddleocr[all]>=3.5.0",
    "paddlepaddle-gpu==3.2.1",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]
default-groups = ["dev"]

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddlepaddle" }

[[tool.uv.index]]
name = "paddlepaddle"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paper_extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
