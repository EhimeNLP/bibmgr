[project]
name = "bibmgr-paper-extractor"
version = "0.1.0"
description = "Metadata and reference-list extraction for PDF papers."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = []

[project.optional-dependencies]
paddleocr-vl = ["paddleocr>=3.0.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
bibmgr-paper-extract = "paper_extractor.cli:main"
bibmgr-paper-parse = "paper_extractor.parse_output:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paper_extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
