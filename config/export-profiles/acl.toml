schema_version = "1"
profile = "acl"
display_name = "ACL"
description = "Compact ACL-oriented output limited to standard publication and identifier fields."
validation_profile = "acl"
preprint_representation = "misc-eprint"
venue_style = "full"
field_order = [
  "author",
  "title",
  "editor",
  "booktitle",
  "journal",
  "month",
  "year",
  "address",
  "publisher",
  "pages",
  "doi",
  "eprint",
  "archiveprefix",
  "primaryclass",
  "url",
  "note",
]
field_case = "lowercase"
value_delimiter = "braces"
line_ending = "lf"
indent = "  "
trailing_comma = true
include_doi = true
include_url = true
include_extra_fields = true
excluded_fields = []
allow_unknown_work_type = false

[field_selection]
allowed_fields = [
  "author",
  "title",
  "editor",
  "booktitle",
  "journal",
  "month",
  "year",
  "address",
  "publisher",
  "pages",
  "doi",
  "eprint",
  "archiveprefix",
  "primaryclass",
  "url",
  "note",
]
excluded_fields = []
