schema_version = "1"
profile = "aaai"
display_name = "AAAI"
description = "Compact AAAI-oriented output without URLs or unrelated database identifiers."
validation_profile = "modern"
preprint_representation = "misc-eprint"
venue_style = "full"
field_order = [
  "author",
  "title",
  "editor",
  "booktitle",
  "journal",
  "volume",
  "number",
  "pages",
  "month",
  "year",
  "publisher",
  "address",
  "doi",
  "eprint",
  "archiveprefix",
  "primaryclass",
  "note",
]
field_case = "lowercase"
value_delimiter = "braces"
line_ending = "lf"
indent = "  "
trailing_comma = true
include_doi = true
include_url = false
include_extra_fields = true
excluded_fields = []
allow_unknown_work_type = false

[field_selection]
allowed_fields = [
  "author",
  "title",
  "editor",
  "booktitle",
  "journal",
  "volume",
  "number",
  "pages",
  "month",
  "year",
  "publisher",
  "address",
  "doi",
  "eprint",
  "archiveprefix",
  "primaryclass",
  "note",
]
excluded_fields = ["url"]
