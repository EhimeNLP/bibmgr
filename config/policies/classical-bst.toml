schema_version = "1"
profile = "classical-bst"
field_case = "lowercase"
field_order = [
  "author",
  "editor",
  "title",
  "booktitle",
  "journal",
  "volume",
  "number",
  "series",
  "pages",
  "publisher",
  "institution",
  "school",
  "address",
  "edition",
  "month",
  "year",
  "howpublished",
  "note",
]
citation_key_pattern = '^[A-Za-z][A-Za-z0-9._:+-]*$'
forbidden_fields = ["eprint", "archiveprefix", "primaryclass", "file"]
url_policy = "forbid"
arxiv_representation = "howpublished"
prefer_braces = true

[required_fields]
article = ["author", "title", "journal", "year"]
inproceedings = ["author", "title", "booktitle", "year"]
book = ["author", "title", "publisher", "year"]
incollection = ["author", "title", "booktitle", "publisher", "year"]
phdthesis = ["author", "title", "school", "year"]
mastersthesis = ["author", "title", "school", "year"]
techreport = ["author", "title", "institution", "year"]

